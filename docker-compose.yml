services:
  # Servicio 1: Base de datos MySQL
  mysqldb:
    image: mysql:8.0
    container_name: shopflow-db
    environment:
      MYSQL_DATABASE: gestor_tienda_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Servicio 2: Tu API de Spring Boot
  app:
    build: .
    container_name: shopflow-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/gestor_tienda_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - mysqldb

volumes:
  mysql_data: